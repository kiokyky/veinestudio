<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#011427" />
      <stop offset="55%" stop-color="#052c47" />
      <stop offset="100%" stop-color="#0E7E8E" />
    </linearGradient>
    <radialGradient id="sonar" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#BAE5E9" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0E7E8E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#011427" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="600" cy="337" r="310" fill="url(#sonar)" />

  <!-- Grid Lines -->
  <g stroke="#BAE5E9" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Sonar Rings -->
  <circle cx="600" cy="337" r="220" stroke="#BAE5E9" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="10 8" />
  <circle cx="600" cy="337" r="145" stroke="#BAE5E9" stroke-opacity="0.5" stroke-width="2" />
  <circle cx="600" cy="337" r="70" stroke="#EFEFEF" stroke-opacity="0.8" stroke-width="3" />

  <!-- Player Diamond Core -->
  <polygon points="600,295 642,337 600,379 558,337" fill="#BAE5E9" />
  <polygon points="600,312 625,337 600,362 575,337" fill="#011427" />

  <!-- Enemy Nodes -->
  <circle cx="790" cy="230" r="14" fill="#EFEFEF" />
  <circle cx="790" cy="230" r="26" stroke="#BAE5E9" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="420" cy="430" r="12" fill="#BAE5E9" />
  <circle cx="420" cy="430" r="22" stroke="#BAE5E9" stroke-width="2" stroke-opacity="0.5" />

  <!-- HUD Elements -->
  <rect x="60" y="55" width="260" height="64" rx="12" fill="#011427" fill-opacity="0.8" stroke="#BAE5E9" stroke-opacity="0.4" />
  <text x="84" y="83" fill="#BAE5E9" font-family="monospace" font-size="15" font-weight="bold">SONAR ENERGY // 94%</text>
  <rect x="84" y="95" width="200" height="10" rx="5" fill="#0E7E8E" />
  <rect x="84" y="95" width="175" height="10" rx="5" fill="#BAE5E9" />

  <rect x="880" y="555" width="260" height="60" rx="12" fill="#011427" fill-opacity="0.8" stroke="#BAE5E9" stroke-opacity="0.4" />
  <text x="905" y="590" fill="#EFEFEF" font-family="monospace" font-size="16" font-weight="bold">DEPTH: -4,280M [ABYSS]</text>
</svg>

